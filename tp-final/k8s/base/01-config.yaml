# ConfigMap: configuración NO sensible. Separarla de la imagen permite cambiar
# parámetros (host de DB, tamaño del pool) sin reconstruir la imagen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: back-config
  namespace: terrasense
data:
  PORT: "3000"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "iot_db"
  DB_POOL_MAX: "10"

# El Secret "db-secret" (usuario y contraseña de PostgreSQL) NO está en este
# archivo a propósito: una contraseña versionada en git queda en el historial
# para siempre y es un hallazgo de SAST (Horusec). Lo crea scripts/deploy.sh
# con una contraseña aleatoria generada al desplegar (o la de la variable
# DB_PASSWORD). En producción se usaría un gestor de secretos (Vault,
# Sealed Secrets, External Secrets).
