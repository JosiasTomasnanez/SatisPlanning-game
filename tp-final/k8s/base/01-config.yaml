# ConfigMap: configuración NO sensible. Separarla de la imagen permite cambiar
# parámetros (host de DB, tamaño del pool) sin reconstruir la imagen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: back-config
  namespace: terrasense
data:
  PORT: "3000"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "iot_db"
  DB_POOL_MAX: "10"
---
# Secret: credenciales. Es el ÚNICO lugar donde vive la contraseña (el código
# ya no tiene un valor por defecto). Ojo: un Secret solo está codificado en
# base64, no cifrado; en un entorno real se usaría un gestor de secretos
# (Vault, Sealed Secrets) y no se versionaría en git. Acá es un laboratorio.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: terrasense
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "cambiar-en-lab"
  DB_USER: "admin"
  DB_PASSWORD: "cambiar-en-lab"
