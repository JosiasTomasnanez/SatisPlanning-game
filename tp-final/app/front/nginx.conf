server {
  # 8080 y no 80: la imagen corre sin root y no puede abrir puertos < 1024.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # __APP_VERSION__ lo reemplaza el Dockerfile en el build.
  # "always": el header sale también en errores (404/500); justamente ahí es
  # cuando más importa saber qué versión respondió.
  add_header X-App-Version "__APP_VERSION__" always;

  # no-store: que ni el navegador ni un proxy guarden copias. Si no, durante el
  # canary un usuario podría seguir viendo una versión vieja desde su caché y
  # las mediciones (qué versión respondió) quedarían falseadas.
  add_header Cache-Control "no-store" always;

  # Los assets NO caen en index.html: si se pide un CSS/JS que este pod no
  # tiene (ej. el HTML lo dio el canary y el CSS lo pide al stable), debe dar
  # un 404 visible. Si devolviera index.html con 200, el error quedaría oculto
  # (el navegador recibiría HTML en lugar de CSS y nadie se daría cuenta).
  location /assets/ {
    try_files $uri =404;
  }

  # Fallback de SPA: cualquier otra ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
